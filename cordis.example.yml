# dsh-qq-bot 加载示例
# 用法：pnpm dsh web --patch ./cordis.example.yml
# 请复制为被 .gitignore 忽略的 cordis.yml，再填写真实凭据。

- insert:
    - id: qq-bot
      name: '/absolute/path/to/dsh-qq-bot/src/index.ts'
      config:
        appId: 'YOUR_APP_ID'
        clientSecret: 'YOUR_APP_SECRET'
        sandbox: false
        publicMode: false
        allowGroups: ['GROUP_OPENID_1']
        allowUsers: ['USER_OPENID_1']
        allowedTools: []
        maxSessions: 100
        sessionIdleMinutes: 60
        requestTimeoutMs: 10000
