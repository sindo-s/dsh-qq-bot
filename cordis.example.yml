# 先 npm run build，再复制为 cordis.yml 并修改插件绝对路径。
# 启动：dsh web --patch /absolute/path/to/cordis.yml
# 更简单的方式：npm run setup 自动生成路径和配置。
- insert:
    - id: qq-bot
      name: '/absolute/path/to/dsh-qq-bot/lib/index.js'
      config:
        # 留空读取 QQ_BOT_APP_ID / QQ_BOT_APP_SECRET，也可直接填写。
        appId: ''
        clientSecret: ''
        sandbox: false
        publicMode: false
        # 首次通过 /whoami 获取 OpenID 后填写，不能填写 QQ 号或群号。
        allowGroups: []
        allowUsers: []
        enableWhoami: true
        allowedTools: []
        maxSessions: 100
        sessionIdleMinutes: 60
        requestTimeoutMs: 10000
